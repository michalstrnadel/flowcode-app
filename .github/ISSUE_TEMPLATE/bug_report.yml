name: 🐛 Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! Please fill this in so we can reproduce the issue quickly.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch flowcode
        2. …
        3. See the issue
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Read-aloud (TTS)
        - Dictation / push-to-talk (STT)
        - Menu / Pause / Launch at Login
        - Orb HUD
        - Setup / install
        - Other
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. 14.5 (Sonoma), Apple Silicon
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: flowcode version / commit
      placeholder: e.g. 0.1.0 or git commit hash
  - type: textarea
    id: engines
    attributes:
      label: Voice services
      description: Output of `curl -fsS http://127.0.0.1:8880/v1/audio/voices` and `curl -fsS http://127.0.0.1:2022/health` (are Kokoro/Whisper up?).
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `~/.voicemode/logs/` or Console.app (redact anything private).
      render: shell
